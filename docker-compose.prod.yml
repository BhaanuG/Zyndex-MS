services:
  # -------------------------------------------------------------
  # 1. Persistence Layer: MySQL 8.4 LTS
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: zyndex-mysql
    restart: always
    command: --innodb-buffer-pool-size=128M --innodb-log-buffer-size=16M --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zyndex_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 2. Service Discovery: Eureka Server
  # -------------------------------------------------------------
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: eureka-server/target/eureka-server-1.0.0.jar
    container_name: zyndex-eureka
    restart: always
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 3. Identity & Authentication Service
  # -------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: auth-service/target/auth-service-1.0.0.jar
    container_name: zyndex-auth
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zyndex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-zyndex_super_secret_hmac_sha256_key_with_at_least_32_characters}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      MAIL_HOST: ${MAIL_HOST:-${OTP_SMTP_HOST:-smtp.gmail.com}}
      MAIL_PORT: ${MAIL_PORT:-${OTP_SMTP_PORT:-587}}
      MAIL_USERNAME: ${MAIL_USERNAME:-${OTP_SMTP_USER:-}}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-${OTP_SMTP_PASS:-}}
      SPRING_MAIL_HOST: ${OTP_SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${OTP_SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${OTP_SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${OTP_SMTP_PASS:-}
      OTP_SMTP_HOST: ${OTP_SMTP_HOST:-smtp.gmail.com}
      OTP_SMTP_PORT: ${OTP_SMTP_PORT:-587}
      OTP_SMTP_USER: ${OTP_SMTP_USER:-}
      OTP_SMTP_PASS: ${OTP_SMTP_PASS:-}
      OTP_MAIL_FROM: ${OTP_MAIL_FROM:-${OTP_SMTP_USER:-Bhaanugali@gmail.com}}
      JAVA_OPTS: "-XX:+UseSerialGC -Xss256k -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 4. Academic Content & In-Memory PDF Slicing Service
  # -------------------------------------------------------------
  content-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: content-service/target/content-service-1.0.0.jar
    container_name: zyndex-content
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zyndex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xss256k -Xms96m -Xmx320m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 5. Entitlement & Quota Access Service
  # -------------------------------------------------------------
  access-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: access-service/target/access-service-1.0.0.jar
    container_name: zyndex-access
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zyndex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 6. Real-Time Telemetry & Session Usage Service
  # -------------------------------------------------------------
  usage-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: usage-service/target/usage-service-1.0.0.jar
    container_name: zyndex-usage
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zyndex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 7. Subscription, UPI QR & UTR Payment Service
  # -------------------------------------------------------------
  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: subscription-service/target/subscription-service-1.0.0.jar
    container_name: zyndex-subscription
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zyndex_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zyndex_secure_root_password_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      MAIL_HOST: ${MAIL_HOST:-${OTP_SMTP_HOST:-smtp.gmail.com}}
      MAIL_PORT: ${MAIL_PORT:-${OTP_SMTP_PORT:-587}}
      MAIL_USERNAME: ${MAIL_USERNAME:-${OTP_SMTP_USER:-}}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-${OTP_SMTP_PASS:-}}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-Bhaanugali@gmail.com}
      JAVA_OPTS: "-XX:+UseSerialGC -Xss256k -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 8. API Gateway Reverse Proxy (Port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: api-gateway/target/api-gateway-1.0.0.jar
    container_name: zyndex-gateway
    restart: always
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-zyndex_super_secret_hmac_sha256_key_with_at_least_32_characters}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-zyndex_internal_mesh_secret_token_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xss256k -Xms96m -Xmx256m"
    networks:
      - zyndex-network

  # -------------------------------------------------------------
  # 9. Web Presentation Layer (Nginx + React SPA)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zyndex-web
    restart: always
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - zyndex-network

volumes:
  mysql_data:

networks:
  zyndex-network:
    driver: bridge
