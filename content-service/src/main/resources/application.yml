server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zyndex_content}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
      file-size-threshold: 2MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

zyndex:
  upload-dir: ${UPLOAD_DIR:backend/uploads}
  main-admin-email: ${MAIN_ADMIN_EMAIL:Bhaanugali@gmail.com}
  otp-mail-from: ${OTP_MAIL_FROM:${OTP_SMTP_USER:}}
  auth-db-name: ${AUTH_DB_NAME:zyndex_auth}

spring.mail:
  host: ${OTP_SMTP_HOST:}
  port: ${OTP_SMTP_PORT:587}
  username: ${OTP_SMTP_USER:}
  password: ${OTP_SMTP_PASS:}
  properties:
    mail.smtp.auth: true
    mail.smtp.connectiontimeout: 15000
    mail.smtp.timeout: 30000
    mail.smtp.writetimeout: 15000
    mail.smtp.starttls.enable: true
    mail.smtp.starttls.required: true
    mail.smtp.ssl.trust: smtp.gmail.com
    mail.smtp.ssl.protocols: TLSv1.2 TLSv1.3
