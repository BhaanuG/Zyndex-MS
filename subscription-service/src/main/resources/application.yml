server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zyndex_subscription}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:${OTP_SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${OTP_SMTP_PORT:${MAIL_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${OTP_SMTP_USER:${MAIL_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${OTP_SMTP_PASS:${MAIL_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 15000
          timeout: 30000
          writetimeout: 15000
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2 TLSv1.3

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

zyndex:
  otp-mail-from: ${OTP_MAIL_FROM:${SPRING_MAIL_USERNAME:${OTP_SMTP_USER:${MAIL_USERNAME:lmno1432@gmail.com}}}}
  auth-db-name: ${AUTH_DB_NAME:zyndex_db}
  receiver-upi-id: ${RECEIVER_UPI_ID:zyndex@icici}

payment:
  mode: ${PAYMENT_MODE:UPI_DIRECT}
